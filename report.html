<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>売上報告</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0e;
  --bg2: #181818;
  --bg3: #222;
  --border: #2e2e2e;
  --border2: #3a3a3a;
  --text: #f0ede8;
  --text2: #888;
  --text3: #555;
  --accent: #c8a96e;
  --green: #5a9e7a;
  --red: #c06060;
  --font: 'Noto Sans JP', sans-serif;
  --mono: 'DM Mono', monospace;
  --r: 10px;
  --r2: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
.app { max-width: 480px; margin: 0 auto; padding-bottom: 32px; }

/* ── Topbar ── */
.topbar { padding: 18px 20px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 10; }
.topbar-title { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.topbar-sub { font-size: 12px; color: var(--text2); font-family: var(--mono); }

/* ── Month nav ── */
.month-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 10px; }
.month-label { font-size: 16px; font-weight: 700; color: var(--text); }
.month-btn { background: none; border: 1px solid var(--border2); color: var(--text2); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, color 0.15s; }
.month-btn:active { color: var(--accent); border-color: var(--accent); }

/* ── Calendar ── */
.cal-wrap { padding: 0 12px; }
.cal-head { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
.cal-head span { text-align: center; font-size: 11px; color: var(--text3); padding: 4px 0; font-family: var(--mono); }
.cal-head span:first-child { color: var(--red); }
.cal-head span:last-child { color: var(--blue, #5a82b4); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-cell { aspect-ratio: 1; border-radius: var(--r2); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; border: 1px solid transparent; transition: border-color 0.15s, background 0.15s; }
.cal-cell:active { background: var(--bg3); }
.cal-cell.empty { cursor: default; }
.cal-cell.has-data { background: var(--bg2); border-color: var(--border); }
.cal-cell.has-data:active { border-color: var(--accent); }
.cal-cell.selected { border-color: var(--accent) !important; background: var(--bg3) !important; }
.cal-cell.today .cal-num { color: var(--accent); font-weight: 700; }
.cal-num { font-size: 14px; color: var(--text2); line-height: 1; }
.cal-cell.has-data .cal-num { color: var(--text); }
.cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-top: 3px; }
.cal-amt { font-size: 9px; font-family: var(--mono); color: var(--accent); margin-top: 2px; line-height: 1; }

/* ── Summary strip ── */
.month-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 14px 12px 0; }
.sum-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r2); padding: 10px 10px 8px; text-align: center; }
.sum-label { font-size: 10px; color: var(--text3); font-family: var(--mono); letter-spacing: 0.06em; }
.sum-val { font-size: 15px; font-weight: 700; color: var(--text); margin-top: 3px; font-family: var(--mono); }
.sum-val.accent { color: var(--accent); }

/* ── Detail panel ── */
.detail { margin: 14px 12px 0; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.detail-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.detail-date { font-size: 14px; font-weight: 700; color: var(--text); }
.detail-total { font-size: 16px; font-weight: 700; color: var(--accent); font-family: var(--mono); }
.detail-body { padding: 4px 0; }
.detail-row { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); gap: 10px; }
.detail-row:last-child { border-bottom: none; }
.detail-name { flex: 1; font-size: 14px; color: var(--text); }
.detail-meta { font-size: 12px; color: var(--text2); font-family: var(--mono); }
.detail-subtotal { font-size: 14px; font-family: var(--mono); color: var(--text); min-width: 72px; text-align: right; }
.detail-slot { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* ── Empty / Loading ── */
.placeholder { text-align: center; padding: 28px 16px; color: var(--text3); font-size: 13px; line-height: 1.8; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; vertical-align: middle; margin-right: 6px; }

/* ── Blue for Sunday ── */
.cal-head span.sun { color: #c06060; }
.cal-head span.sat { color: #5a82b4; }
.cal-cell.sat .cal-num { color: #5a82b4; }
.cal-cell.sat.has-data .cal-num { color: #7aa4d4; }
.cal-cell.sun .cal-num { color: var(--red); }
.cal-cell.sun.has-data .cal-num { color: #d08080; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="topbar-title">売上報告</span>
    <span class="topbar-sub" id="topbar-sub">読み込み中...</span>
  </div>

  <div class="month-nav">
    <button class="month-btn" onclick="changeMonth(-1)">‹</button>
    <span class="month-label" id="month-label"></span>
    <button class="month-btn" onclick="changeMonth(1)">›</button>
  </div>

  <div class="cal-wrap">
    <div class="cal-head">
      <span class="sun">日</span><span>月</span><span>火</span>
      <span>水</span><span>木</span><span>金</span><span class="sat">土</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="month-summary" id="month-summary"></div>

  <div id="detail-wrap"></div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbw6Kn_R_WdbV3F4teZEm7gmclg07NZ-dJhxGYpKENaG3K-Kw53xf39vL9pfiMcP5YPF/exec";

let allSales = [];
let selectedDate = null;
let currentYear, currentMonth;

const today = new Date();
currentYear  = today.getFullYear();
currentMonth = today.getMonth(); // 0-indexed

// ── 初期ロード ──
async function init() {
  document.getElementById("topbar-sub").textContent = "データ取得中...";
  try {
    const res  = await fetch(`${GAS_URL}?action=sales`, { mode: "cors" });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    allSales = json.data;
    document.getElementById("topbar-sub").textContent =
      `${allSales.length}件のデータ`;
  } catch(e) {
    document.getElementById("topbar-sub").textContent = "取得失敗";
  }
  renderCalendar();
}

// ── 月移動 ──
function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0;  currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  selectedDate = null;
  document.getElementById("detail-wrap").innerHTML = "";
  renderCalendar();
}

// ── カレンダー描画 ──
function renderCalendar() {
  const y = currentYear, m = currentMonth;
  document.getElementById("month-label").textContent =
    `${y}年${m+1}月`;

  // 当月の売上をdate文字列→[rows]のマップに
  const salesMap = {};
  allSales.forEach(r => {
    const d = String(r["日付"] || "").slice(0, 10);
    if (!d) return;
    const [ry, rm] = d.split("-").map(Number);
    if (ry === y && rm === m+1) {
      if (!salesMap[d]) salesMap[d] = [];
      salesMap[d].push(r);
    }
  });

  // 月サマリー
  const monthRows = Object.values(salesMap).flat();
  const monthTotal = monthRows.reduce((s, r) => s + Number(r["小計"]||0), 0);
  const opDays = Object.keys(salesMap).length;
  const avg = opDays > 0 ? Math.round(monthTotal / opDays) : 0;
  document.getElementById("month-summary").innerHTML = `
    <div class="sum-card"><div class="sum-label">月間売上</div><div class="sum-val accent">¥${monthTotal.toLocaleString()}</div></div>
    <div class="sum-card"><div class="sum-label">営業回数</div><div class="sum-val">${opDays}回</div></div>
    <div class="sum-card"><div class="sum-label">1回平均</div><div class="sum-val">¥${avg.toLocaleString()}</div></div>`;

  // カレンダーグリッド
  const firstDay = new Date(y, m, 1).getDay(); // 0=Sun
  const lastDate = new Date(y, m+1, 0).getDate();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;

  let html = "";
  // 空白セル
  for (let i = 0; i < firstDay; i++) {
    html += `<div class="cal-cell empty"></div>`;
  }
  for (let d = 1; d <= lastDate; d++) {
    const dateStr = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dow = new Date(y, m, d).getDay();
    const rows = salesMap[dateStr];
    const hasData = !!rows;
    const dayTotal = hasData ? rows.reduce((s, r) => s + Number(r["小計"]||0), 0) : 0;
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === selectedDate;
    const dowClass = dow === 0 ? "sun" : dow === 6 ? "sat" : "";

    let cls = "cal-cell";
    if (hasData)    cls += " has-data";
    if (isToday)    cls += " today";
    if (isSelected) cls += " selected";
    if (dowClass)   cls += ` ${dowClass}`;

    html += `<div class="${cls}" onclick="${hasData ? `selectDate('${dateStr}')` : ''}">
      <span class="cal-num">${d}</span>
      ${hasData ? `<div class="cal-dot"></div><div class="cal-amt">¥${dayTotal >= 1000 ? Math.round(dayTotal/1000)+'k' : dayTotal}</div>` : ""}
    </div>`;
  }
  document.getElementById("cal-grid").innerHTML = html;

  // 選択中の日付のdetailを再描画
  if (selectedDate) renderDetail(selectedDate);
}

// ── 日付選択 ──
function selectDate(dateStr) {
  selectedDate = dateStr;
  renderCalendar();
  renderDetail(dateStr);
  // 詳細へスクロール
  setTimeout(() => {
    document.getElementById("detail-wrap").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, 50);
}

// ── 詳細描画 ──
const BASHO_DAI = 3000;

function renderDetail(dateStr) {
  const rows = allSales.filter(r => String(r["日付"]||"").slice(0,10) === dateStr);
  if (rows.length === 0) {
    document.getElementById("detail-wrap").innerHTML = "";
    return;
  }

  // 品目ごとに集計
  const itemMap = {};
  rows.forEach(r => {
    const name = r["ドリンク名"] || r["品目"] || "不明";
    if (!itemMap[name]) itemMap[name] = { cups: 0, subtotal: 0, price: Number(r["単価"]||0), slots: new Set(), stock: r["在庫区分"] || "自在庫" };
    itemMap[name].cups     += Number(r["杯数"]||0);
    itemMap[name].subtotal += Number(r["小計"]||0);
    if (r["時間帯"]) itemMap[name].slots.add(r["時間帯"]);
  });

  const total      = Object.values(itemMap).reduce((s, v) => s + v.subtotal, 0);
  const myStock    = Object.values(itemMap).filter(v => v.stock !== "店舗在庫").reduce((s, v) => s + v.subtotal, 0);
  const shopStock  = Object.values(itemMap).filter(v => v.stock === "店舗在庫").reduce((s, v) => s + v.subtotal, 0);
  const myShare    = myStock - BASHO_DAI;

  const [year, mon, day] = dateStr.split("-");
  const dow = ["日","月","火","水","木","金","土"][new Date(Number(year), Number(mon)-1, Number(day)).getDay()];

  const itemRows = Object.entries(itemMap)
    .sort((a, b) => b[1].subtotal - a[1].subtotal)
    .map(([name, v]) => `
      <div class="detail-row">
        <div>
          <div class="detail-name">${name}
            <span style="font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px;
              background:${v.stock === "店舗在庫" ? "rgba(90,130,180,0.15)" : "rgba(90,158,122,0.15)"};
              color:${v.stock === "店舗在庫" ? "#7aa4d4" : "#5a9e7a"};">${v.stock}</span>
          </div>
          <div class="detail-slot">${[...v.slots].join(" / ") || ""}</div>
        </div>
        <div class="detail-meta">${v.price > 0 ? `¥${v.price.toLocaleString()} × ${v.cups}` : `${v.cups}点`}</div>
        <div class="detail-subtotal">¥${v.subtotal.toLocaleString()}</div>
      </div>`).join("");

  document.getElementById("detail-wrap").innerHTML = `
    <div class="detail">
      <div class="detail-header">
        <span class="detail-date">${parseInt(mon)}月${parseInt(day)}日（${dow}）</span>
        <span class="detail-total">¥${total.toLocaleString()}</span>
      </div>
      <div class="detail-body">${itemRows}</div>
      <div style="border-top:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:7px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:var(--text2)">自在庫売上</span>
          <span style="font-family:var(--mono);color:var(--green)">¥${myStock.toLocaleString()}</span>
        </div>
        ${shopStock > 0 ? `<div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:var(--text2)">店舗在庫売上</span>
          <span style="font-family:var(--mono);color:#7aa4d4">¥${shopStock.toLocaleString()}</span>
        </div>` : ""}
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:var(--text2)">場所代</span>
          <span style="font-family:var(--mono);color:var(--red)">− ¥${BASHO_DAI.toLocaleString()}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;border-top:1px solid var(--border);padding-top:8px;margin-top:2px;">
          <span style="color:var(--text)">手取り</span>
          <span style="font-family:var(--mono);color:${myShare >= 0 ? "var(--accent)" : "var(--red)"}">¥${myShare.toLocaleString()}</span>
        </div>
      </div>
    </div>`;
}

init();
</script>
</body>
</html>
